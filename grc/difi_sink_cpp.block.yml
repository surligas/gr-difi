id: difi_sink_cpp
label: DIFI Sink
category: '[DIFI]'
templates:
  imports: import difi
  make: difi.difi_sink_cpp_${ 'sc8' if bit_depth == '8' else 'sc16' }(${ip_addr}, ${port}, ${sample_rate}, ${data_size}, ${stream_id}, ${context_packet_send_count}, ${ '""' if mode == 'streaming' else length_tag_name }, int(${lead_time_us}), int(${context_pack_size}), int(${protocol}), float(${rf_freq}), float(${if_freq}), float(${bandwidth}), float(${rf_gain}), float(${if_gain}), float(${ref_level}), float(${if_band_offset}), int(${ref_point}), int(${time_source}), bool(${rate_control}), float(${max_buffer_fill_pct}), float(${buffer_fill_delta}))
  callbacks:
  - set_rf_freq(${rf_freq})
  - set_if_freq(${if_freq})
  - set_bandwidth(${bandwidth})
  - set_rf_gain(${rf_gain})
  - set_if_gain(${if_gain})
  - set_ref_level(${ref_level})
  - set_if_band_offset(${if_band_offset})
  - set_ref_point(difi.reference_point(${ref_point}))
  - set_time_source(difi.tsi_type(${time_source}))
  - set_rate_control(${rate_control})
  - set_max_buffer_fill_pct(${max_buffer_fill_pct})
  - set_buffer_fill_delta(${buffer_fill_delta})

parameters:
- id: bit_depth
  label: Bit Depth
  dtype: enum
  options: ['8', '16']
  option_labels: ['8-bit (Complex Byte)', '16-bit (Complex Short)']
  default: '16'
- id: mode
  label: Mode
  dtype: enum
  options: ['streaming', 'burst']
  option_labels: ['Streaming', 'Burst']
  default: 'streaming'
- id: length_tag_name
  label: Length Tag Name
  dtype: string
  default: packet_len
  hide: ${ ('none' if mode == 'burst' else 'all') }
- id: ip_addr
  label: Forwarding IP Address
  dtype: string
  default: "127.0.0.1"
- id: port
  label: Port Number
  dtype: int
  default: 0
- id: protocol
  label: Protocol
  dtype: enum
  default: '2'
  options: ['1', '2']
  option_labels: ['TCP', 'UDP']
  hide: part
- id: sample_rate
  label: Sample Rate
  dtype: int
  default: samp_rate
- id: data_size
  label: Samples Per Packet
  dtype: int
  default: 128
  hide: part
- id: stream_id
  label: Stream ID
  dtype: int
  default: 80000
  hide: part
- id: context_packet_send_count
  label: Context packet interval
  dtype: int
  default: 1000
  hide: part
- id: context_pack_size
  label: Context Packet Type
  dtype: enum
  options: ['108', '72']
  option_labels: ['Standard (108 bytes)', 'Alternative (72 bytes)']
  default: '108'
  hide: part

# Time Tab
- id: time_source
  label: Time Source (TSI)
  category: Time
  dtype: enum
  options: ['3', '1', '2']
  option_labels: ['POSIX (Unix Epoch, no leap seconds)', 'UTC (1970 Epoch, with leap seconds)', 'GPS (1980 Epoch, no leap seconds)']
  default: '3'
  hide: part
- id: lead_time_us
  label: Burst Lead Time (us)
  category: Time
  dtype: int
  default: 10000
  hide: ${ ('none' if mode == 'burst' else 'all') }
- id: rate_control
  label: Rate Control
  category: Time
  dtype: enum
  options: ['False', 'True']
  option_labels: ['Disabled', 'Enabled']
  default: 'False'
- id: max_buffer_fill_pct
  label: Max Buffer Fill (%)
  category: Time
  dtype: float
  default: '50.0'
  hide: ${ ('none' if rate_control == 'True' else 'all') }
- id: buffer_fill_delta
  label: Buffer Fill Delta (%)
  category: Time
  dtype: float
  default: '1.0'
  hide: part

# RF Options Tab
- id: rf_freq
  label: Center Freq (Hz)
  category: RF Options
  dtype: real
  default: '0'
  hide: part
- id: if_freq
  label: IF Freq (Hz)
  category: RF Options
  dtype: real
  default: '0'
  hide: part
- id: bandwidth
  label: Bandwidth (Hz)
  category: RF Options
  dtype: real
  default: '0'
  hide: part
- id: rf_gain
  label: RF Gain (dB)
  category: RF Options
  dtype: float
  default: '0'
  hide: ${ ('all' if context_pack_size == '72' else 'part') }
- id: if_gain
  label: IF Gain (dB)
  category: RF Options
  dtype: float
  default: '0'
  hide: ${ ('all' if context_pack_size == '72' else 'part') }
- id: ref_level
  label: Reference Level (dBm)
  category: RF Options
  dtype: float
  default: '0'
  hide: ${ ('all' if context_pack_size == '72' else 'part') }
- id: if_band_offset
  label: IF Band Offset (Hz)
  category: RF Options
  dtype: real
  default: '0'
  hide: part
- id: ref_point
  label: Reference Point
  category: RF Options
  dtype: enum
  options: ['100', '75', '25', '0']
  option_labels: ['IF Converter (100 / 0x64)', 'RF Converter (75 / 0x4B)', 'Antenna Feed (25 / 0x19)', 'Unspecified (0)']
  default: '100'
  hide: ${ ('all' if context_pack_size == '72' else 'part') }

asserts:
- ${ mode != 'burst' or len(length_tag_name.strip('\"\'')) > 0 }

inputs:
- label: in
  domain: stream
  dtype: ${ 'sc8' if bit_depth == '8' else 'sc16' }

outputs:
- label: status
  domain: message
  id: status
  optional: true

documentation: |-
     A DIFI sink block based on IEEE-ISTO Std 4900-2021 (Digital IF Interoperability Standard).
     Transmits complex integer samples over UDP or TCP network sockets.

     Input types:
     - 8-bit depth: Complex Byte (sc8, interleaved chars)
     - 16-bit depth: Complex Short (sc16, interleaved shorts)

     Modes:
     - Streaming: Continuous streaming of samples. Length tag name is empty.
     - Burst: Transmit bursts defined by length tags (e.g., packet_len). Samples outside bursts are dropped.

file_format: 1
