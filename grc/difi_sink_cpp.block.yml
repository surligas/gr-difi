id: difi_sink_cpp
label: DIFI Sink
category: '[DIFI]'
templates:
  imports: import difi
  make: difi.difi_sink_cpp_${ 'sc8' if bit_depth == '8' else 'sc16' }(${ip_addr}, ${port}, ${sample_rate}, ${data_size}, ${stream_id}, ${context_packet_send_count}, ${reference_time_full}, ${reference_time_frac}, ${ '""' if mode == 'streaming' else length_tag_name }, int(${lead_time_us}), int(${context_pack_size}), int(${protocol}), float(${rf_freq}), float(${if_freq}), float(${bandwidth}), float(${rf_gain}), float(${if_gain}), float(${ref_level}), float(${if_band_offset}), int(${ref_point}))
  callbacks:
  - set_rf_freq(${rf_freq})
  - set_if_freq(${if_freq})
  - set_bandwidth(${bandwidth})
  - set_rf_gain(${rf_gain})
  - set_if_gain(${if_gain})
  - set_ref_level(${ref_level})
  - set_if_band_offset(${if_band_offset})
  - set_ref_point(difi.reference_point(${ref_point}))

parameters:
- id: bit_depth
  label: Bit Depth
  dtype: enum
  options: ['8', '16']
  option_labels: ['8-bit (Complex Byte)', '16-bit (Complex Short)']
  default: '16'
- id: mode
  label: Mode
  dtype: enum
  options: ['streaming', 'burst']
  option_labels: ['Streaming', 'Burst']
  default: 'streaming'
- id: length_tag_name
  label: Length Tag Name
  dtype: string
  default: packet_len
  hide: ${ ('none' if mode == 'burst' else 'all') }
- id: lead_time_us
  label: Burst Lead Time (us)
  dtype: int
  default: 10000
  hide: ${ ('none' if mode == 'burst' else 'all') }
- id: ip_addr
  label: Forwarding IP Address
  dtype: string
  default: "127.0.0.1"
- id: port
  label: Port Number
  dtype: int
  default: 0
- id: protocol
  label: Protocol
  dtype: enum
  default: '2'
  options: ['1', '2']
  option_labels: ['TCP', 'UDP']
- id: sample_rate
  label: Sample Rate
  dtype: int
  default: samp_rate
- id: reference_time_full
  label: Reference Time Full
  dtype: int
  default: 1666209080
- id: reference_time_frac
  label: Reference Time Frac
  dtype: int
  default: 964925050735
- id: data_size
  label: Samples Per Packet
  dtype: int
  default: 128
- id: stream_id
  label: Stream ID
  dtype: int
  default: 80000
- id: context_packet_send_count
  label: Context packet interval
  dtype: int
  default: 1000
- id: context_pack_size
  label: Context Packet Type
  dtype: enum
  options: ['108', '72']
  option_labels: ['Standard (108 bytes)', 'Alternative (72 bytes)']
  default: '108'
- id: rf_freq
  label: Center Freq (Hz)
  category: RF Options
  dtype: real
  default: '0'
- id: if_freq
  label: IF Freq (Hz)
  category: RF Options
  dtype: real
  default: '0'
- id: bandwidth
  label: Bandwidth (Hz)
  category: RF Options
  dtype: real
  default: '0'
- id: rf_gain
  label: RF Gain (dB)
  category: RF Options
  dtype: float
  default: '0'
  hide: ${ ('none' if context_pack_size == '108' else 'all') }
- id: if_gain
  label: IF Gain (dB)
  category: RF Options
  dtype: float
  default: '0'
  hide: ${ ('none' if context_pack_size == '108' else 'all') }
- id: ref_level
  label: Reference Level (dBm)
  category: RF Options
  dtype: float
  default: '0'
  hide: ${ ('none' if context_pack_size == '108' else 'all') }
- id: if_band_offset
  label: IF Band Offset (Hz)
  category: RF Options
  dtype: real
  default: '0'
- id: ref_point
  label: Reference Point
  category: RF Options
  dtype: enum
  options: ['100', '75', '25', '0']
  option_labels: ['IF Converter (100 / 0x64)', 'RF Converter (75 / 0x4B)', 'Antenna Feed (25 / 0x19)', 'Unspecified (0)']
  default: '100'
  hide: ${ ('none' if context_pack_size == '108' else 'all') }

asserts:
- ${ mode != 'burst' or len(length_tag_name.strip('\"\'')) > 0 }

inputs:
- label: in
  domain: stream
  dtype: ${ 'sc8' if bit_depth == '8' else 'sc16' }

documentation: |-
     A DIFI sink block based on IEEE-ISTO Std 4900-2021 (Digital IF Interoperability Standard).
     Transmits complex integer samples over UDP or TCP network sockets.

     Input types:
     - 8-bit depth: Complex Byte (sc8, interleaved chars)
     - 16-bit depth: Complex Short (sc16, interleaved shorts)

     Modes:
     - Streaming: Continuous streaming of samples. Length tag name is empty.
     - Burst: Transmit bursts defined by length tags (e.g., packet_len). Samples outside bursts are dropped.

file_format: 1
